# Build and deploy the Vite app to GitHub Pages.
#
# ONE-TIME SETUP (otherwise you get a 404 at *.github.io):
# 1. Repo → Settings → Pages → Build and deployment
# 2. Set "Source" to "GitHub Actions" (NOT "Deploy from a branch").
# 3. Push to main or run this workflow manually from the Actions tab.
#
# Your site URL is NOT github.com/... — it is a *.github.io address, e.g.:
#   https://neilllatham.github.io/176-finalProject/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
